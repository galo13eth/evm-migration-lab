[package]
name = "evm-snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic ERC-721/1155 snapshot and OpenZeppelin-compatible proof generator"

[dependencies]
alloy = { version = "2.3.0", features = ["full"] }
clap = { version = "4.5.46", features = ["derive", "env"] }
futures = "0.3.31"
merkrs = "0.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.7.0"
tempfile = "3.21.0"

[[bench]]
name = "snapshot"
harness = false
